name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    name: Validate code changes
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-test.txt

      - name: Install application and test dependencies
        run: python -m pip install . -r requirements-test.txt

      - name: Check Python syntax
        run: python -m compileall -q collector spark/jobs tests

      - name: Run tests
        run: python -m pytest --durations=10
