[build-system]
requires = ["setuptools>=75,<76"]
build-backend = "setuptools.build_meta"

[project]
name = "laptop-metrics"
version = "0.1.0"
description = "A macOS system metric collector backed by Apache Kafka"
readme = "README.md"
requires-python = ">=3.11,<3.15"
dependencies = [
  "kafka-python==3.0.9",
  "psutil==7.2.2",
]

[project.optional-dependencies]
dev = [
  "mypy==1.17.1",
  "pytest==8.4.1",
  "ruff==0.12.7",
  "types-psutil==7.0.0.20250601",
]

[project.scripts]
laptop-metrics-collector = "collector.main:main"

[tool.setuptools.packages.find]
include = ["collector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["collector"]

[[tool.mypy.overrides]]
module = ["kafka", "kafka.*"]
ignore_missing_imports = true
