name: CI - Format

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    name: Validate syntax and Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-quality.txt

      - name: Install quality dependencies
        run: python -m pip install -r requirements-quality.txt

      - name: Check Python syntax
        run: python -m compileall -q collector spark/jobs tests

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Run Ruff lint
        run: python -m ruff check .
