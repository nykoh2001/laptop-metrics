name: CI - Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Run tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-test.txt

      - name: Install application and test dependencies
        run: python -m pip install . -r requirements-test.txt

      - name: Start Kafka
        env:
          CLICKHOUSE_PASSWORD: ci-only
          GRAFANA_ADMIN_PASSWORD: ci-only
        run: docker compose up -d --wait kafka

      - name: Run tests
        run: python -m pytest --durations=10
        env:
          KAFKA_BOOTSTRAP_SERVERS: localhost:9092
          RUN_KAFKA_INTEGRATION_TESTS: "1"

      - name: Show Kafka logs on failure
        if: failure()
        env:
          CLICKHOUSE_PASSWORD: ci-only
          GRAFANA_ADMIN_PASSWORD: ci-only
        run: docker compose logs kafka
