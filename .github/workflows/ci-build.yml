name: CI - Build

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Python package
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            requirements.txt
            requirements-build.txt

      - name: Install build dependencies
        run: python -m pip install -r requirements-build.txt

      - name: Build source and wheel distributions
        run: python -m build

      - name: Verify distribution artifacts
        run: |
          python -c "from pathlib import Path; assert len(list(Path('dist').glob('*.tar.gz'))) == 1; assert len(list(Path('dist').glob('*.whl'))) == 1"
          python -m venv "${RUNNER_TEMP}/wheel-check"
          "${RUNNER_TEMP}/wheel-check/bin/python" -m pip install dist/*.whl
          cd "${RUNNER_TEMP}"
          wheel-check/bin/python -m pip check
          wheel-check/bin/python -c "from importlib.metadata import version; from collector.main import main; assert version('laptop-metrics') == '0.1.0'; assert callable(main)"
          test -x wheel-check/bin/laptop-metrics-collector
